 function spark(f){return `<svg class="fc-spark" data-spark="${f.id}" role="img" aria-label="${f.name}: schematischer Netto-PnL-Verlauf im Demozeitraum"></svg>`;}
 function header(title,sub,back=false){return `${back?'<button type="button" class="fc-link cursor-interaction" data-back="1">← Alle Flotten</button>':''}<div class="fc-heading"><div><h1>${title}</h1><p>${sub}</p></div>${periods()}</div>`;}
 function cards(){return `<div class="fc-fleetgrid">${fleets.map(f=>`<article class="fc-fleet"><div class="fc-fleet-head"><div class="fc-fleet-name"><span class="fc-emblem"><i data-lucide="${f.icon}" aria-hidden="true"></i></span><div><h2>${f.name}</h2><p>${f.role}</p></div></div><span class="fc-badge">Demo · ${f.rev}</span></div><div class="fc-fleet-pnl"><div><div class="fc-meta">Trading-Nettoergebnis</div><div class="fc-pnl ${tone(delta(f))}">${signed(delta(f))}</div></div>${spark(f)}</div><div class="fc-three"><div><small>Profit Factor · 30 T</small>${f.pf}</div><div><small>Winrate · 30 T</small>${(100*f.wins/f.trades).toFixed(1).replace('.',',')} %</div><div><small>Max. beobachteter DD</small>${eur(dd(values(f)))}</div></div><div class="fc-meta">${f.count} Varianten · ${f.tf} · ${f.trades} Zyklen / 30 T</div><div class="fc-resource"><span>Stoprisiko gebunden</span><span>${eur(f.risk)} / ${eur(f.cap)}</span></div><div class="fc-meter"><span style="width:${100*f.risk/f.cap}%"></span></div><div class="fc-state"><span class="${f.fresh?(f.id==='nova'?'fc-warn':'fc-pos'):'fc-warn'}"><span class="fc-dot"></span>${f.status}</span><span>Entry: ${f.entry}</span><span>${f.manage}</span>${f.id==='nova'?'<span class="fc-warn">1 Pool 100 % · UNKNOWN 1.500 €</span>':''}${f.id==='atlas'?'<span>1 Altposition · Revision auslaufend</span>':''}</div><div class="fc-cardbottom"><span class="fc-meta">${f.positions} Position${f.positions>1?'en':''} · Stand ${f.age}</span><button type="button" class="fc-link cursor-interaction" data-fleet="${f.id}">Flotte öffnen <span aria-hidden="true">↗</span></button></div></article>`).join('')}</div>`;}
 function attention(){return `<section class="fc-panel"><div class="fc-panelhead"><h2>Aufmerksamkeit</h2><span class="fc-tag">2 Flotten</span></div><div class="fc-incident"><strong class="fc-warn">Nova · Wirkung ungeklärt</strong><p>Ein Intent bindet 1.500 € Stoprisiko. Ein Pool nimmt keine neuen Einstiege an.</p><button type="button" class="fc-link cursor-interaction" data-fleet="nova" data-tab="risk">Pool ansehen →</button></div><div class="fc-incident"><strong class="fc-warn">Vega · Quelle veraltet</strong><p>Letzte Beobachtung 14:05. Aktueller Handelszustand unbekannt; aus Gesamtsumme ausgeschlossen.</p><button type="button" class="fc-link cursor-interaction" data-fleet="vega" data-tab="ops">Datenstatus ansehen →</button></div></section>`;}
 function overview(){const current=observed(),sum=current.reduce((s,f)=>s+delta(f),0),p=totalPath();return header('Flottenübersicht','Performance, Risiko und Betrieb deiner Flotten-EAs.')+`<div class="fc-toolbar"><span class="fc-meta">${range()} · EUR · Demo-Einsätze</span><span class="fc-meta"><span class="fc-dot fc-pos"></span>3 von 4 Quellen aktuell · Teilumfang</span></div><div class="fc-stats">${metric('Trading-Nettoergebnis',signed(sum),'3 von 4 Flotten · gleicher EUR-Scope',tone(sum))}${metric('Max. beobachteter DD',eur(dd(p)),'PnL-Pfad · 5-Min.-Sampling')}${metric('Stoprisiko gebunden',eur(8800),'von 18.000 € · 1 Pool 100 % / UNKNOWN')}${metric('Aufmerksamkeit','2 Flotten','1 Entryblockade · 1 veraltete Quelle','fc-warn')}</div><div class="fc-split"><section class="fc-panel"><div class="fc-panelhead"><h2>Netto-PnL-Verlauf</h2><span class="fc-tag">3 aktuelle Flotten</span></div><p class="fc-meta">Gebucht + offene Bewertung · 0 € am Zeitraumstart</p>${chart(p,'Zurechenbarer Netto-PnL der drei aktuellen Beispiel-Flotten in EUR')}<div class="fc-legend"><span><span class="fc-linekey"></span>Netto-PnL · EUR</span><span>Vega ausgeschlossen · keine Konto-Equity</span></div></section>${attention()}</div><div class="fc-toolbar"><h2>Deine Flotten <span class="fc-muted">/ 04</span></h2><span class="fc-meta">Alle Stände sichtbar · Kennzahlen nach Scope</span></div>${cards()}`;}
 function fleetStatus(f){const stale=!f.fresh;return `<div class="fc-statusbar"><span class="${stale?'fc-warn':'fc-pos'}">Kern: ${stale?'unbekannt':'Fortschritt bestätigt'}</span><span>Worker: ${stale?'unbekannt':f.count+'/'+f.count+' bereit'}</span><span>Broker: ${stale?'unbekannt':'verbunden'}</span><span class="${stale?'fc-warn':'fc-pos'}">Daten: ${stale?'30 Min. alt':'aktuell'}</span><span>Entry: ${f.entry}</span><span>${f.manage}</span><span>UNKNOWN: ${stale?'unbekannt':f.id==='nova'?'1 / 1.500 €':'0'}</span><span>Aufnahme: Demo bestätigt</span></div>`;}
 function fleetStats(f){const n=delta(f);return `<div class="fc-stats">${metric('Trading-Nettoergebnis',signed(n),state.days===30?`Gebucht ${signed(f.booked)} · offen ${signed(f.float)}`:'Veränderung gebucht + offen · 7 Tage',tone(n))}${metric('Profit Factor · 30 Tage',f.pf,`${f.trades} geschlossene Tradezyklen`)}${metric('Winrate · 30 Tage',(100*f.wins/f.trades).toFixed(1).replace('.',',')+' %',`${f.wins} Gewinn · ${f.trades-f.wins} Verlust · 0 BE`)}${metric('Max. beobachteter DD',eur(dd(values(f))),'PnL-Pfad · EUR · gewählter Zeitraum')}</div>`;}
 const tabs=[['overview','Überblick'],['variants','Varianten'],['risk','Risiko'],['journal','Journal'],['analysis','Analyse'],['ops','Betrieb & Daten']];
 function fleetPage(){const f=fleets.find(x=>x.id===state.fleet);return header(f.name+' / Fleet',`${f.role} · Demo-Einsatz · Manifest ${f.rev} · ${range()}`,true)+(!f.fresh?'<div class="fc-notice">Veralteter Stand von 14:05 · 30 Minuten ohne neue Beobachtung. Entry und Verwaltung sind aktuell unbekannt. Alle Werte unten sind der letzte bekannte Stand.</div>':'')+fleetStatus(f)+`<div class="fc-tabs" aria-label="Flottendetails">${tabs.map(([id,label])=>`<button type="button" class="cursor-interaction" data-tab="${id}" aria-pressed="${state.tab===id}">${label}</button>`).join('')}</div>`+(state.tab==='overview'?fleetOverview(f):state.tab==='variants'?variants(f):state.tab==='risk'?riskPanel(f):state.tab==='journal'?journal(f):state.tab==='analysis'?analysis(f):ops(f));}
 function fleetOverview(f){return fleetStats(f)+`<section class="fc-panel"><div class="fc-panelhead"><h2>Zurechenbares Flottenergebnis</h2><span class="fc-tag">${f.rev} · EUR</span></div><p class="fc-meta">${range()} · Messintervall 5 Min. · Kurve für den Draft verdichtet</p>${chart(values(f).map(v=>v-values(f)[0]),f.name+' Netto-PnL in EUR')}<div class="fc-legend"><span><span class="fc-linekey"></span>Trading-Nettoergebnis</span><span>Cashflows separat · kein Prozentwert ohne Kapitalbasis</span></div></section><div class="fc-split fc-section"><section class="fc-panel"><h2>Strategiebeiträge</h2><p class="fc-subtitle">30 Tage · einschließlich offener Bewertung</p>${contributions(f)}<button type="button" class="fc-link cursor-interaction" data-tab="variants">Alle Varianten im Detail →</button></section><section class="fc-panel"><h2>Kontoperspektive</h2><p class="fc-subtitle">Ein eigenes EUR-Demokonto je Flotte</p>${dataRows([['Native Equity',eur(100000+f.pnl)],['Native Balance',eur(100000+f.booked)],['Native Margin',eur(f.margin)],['Offene Bewertung',signed(f.float)],['Cashflows im Zeitraum','0 €'],['Abgleichsrest','0 € · Demoannahme']])}<p class="fc-meta">Basisaufnahme 05.10.: 100.000 € · Konto- und Flottenscope im Beispiel identisch.</p></section></div>`;}
 function contributions(f){const max=Math.max(...variantData[f.id].map(v=>Math.abs(v[5])));return `<div class="fc-barlist">${variantData[f.id].map((v,i)=>`<div><div class="fc-barlabel"><button class="fc-link cursor-interaction" type="button" data-variant="${i}">${v[0]}</button><span class="${tone(v[5])}">${signed(v[5])}</span></div><div class="fc-meter"><span style="width:${Math.abs(v[5])/max*100}%;background:${v[5]<0?'var(--fc-red)':'var(--fc-cyan)'}"></span></div></div>`).join('')}</div>`;}
 function dataRows(rows){return `<div class="fc-rows">${rows.map(([a,b])=>`<div class="fc-datarow"><span>${a}</span><span>${b}</span></div>`).join('')}</div>`;}
 function variants(f){const list=variantData[f.id];return `<section class="fc-panel"><div class="fc-panelhead"><h2>Varianten & Strategien</h2><span class="fc-tag">${list.length} Varianten</span></div><p class="fc-subtitle">30-Tage-Kennzahlen · Originalrevisionen bleiben erhalten · x = nominales Entryrisiko</p><div class="fc-tablewrap"><table><thead><tr><th>Strategie</th><th>Symbol / TF</th><th>Entryrisiko x</th><th>Netto-PnL</th><th>PF / Zyklen</th><th>Zustand</th></tr></thead><tbody>${list.map((v,i)=>`<tr><td><button class="fc-link cursor-interaction" type="button" data-variant="${i}">${v[0]}</button><small>${v[3]} · Originalrevision</small></td><td>${v[1]}<small>${v[2]}</small></td><td>${eur(v[4])}<small>${(100*v[4]/list.reduce((s,v)=>s+v[4],0)).toFixed(1).replace('.',',')} % von R</small></td><td class="${tone(v[5])}">${signed(v[5])}</td><td>${v[8]}<small>n = ${v[6]}</small></td><td class="${v[9]==='UNKNOWN'?'fc-warn':''}">${v[9]}</td></tr>`).join('')}</tbody></table></div><p class="fc-meta" style="margin-top:14px">Nominalrisikoanteile sind keine Kapitalanteile. Die tatsächliche Poolbelegung steht unter Risiko.</p>${variantDetail(f)}</section>`;}
 function variantDetail(f){if(state.variant===null||!variantData[f.id][state.variant])return '';const v=variantData[f.id][state.variant];return `<div class="fc-detail"><div class="fc-panelhead"><h2>${v[0]} / ${v[3]}</h2><button type="button" class="fc-link cursor-interaction" data-close-variant="1">Schließen</button></div><p class="fc-subtitle">${v[1]} · ${v[2]} · Strategiepaket / ${f.id}-${v[3]} · 30 Tage</p><div class="fc-valuegroup"><div class="fc-plainstat"><small>Netto-PnL · gebucht + offen</small>${signed(v[5])}</div><div class="fc-plainstat"><small>Winrate · n = ${v[6]}</small>${(100*v[7]/v[6]).toFixed(1).replace('.',',')} %</div><div class="fc-plainstat"><small>Ursprüngliches Entryrisiko x</small>${eur(v[4])}</div><div class="fc-plainstat"><small>MAE / MFE</small>— <small>Kein qualifizierter Positionspfad im Draft</small></div></div>${dataRows([['Neueinstiege',v[9]==='UNKNOWN'?'Gesperrt · Wirkung ungeklärt':v[9]==='Auslaufend'?'Keine neuen Einstiege':f.fresh?'Erlaubt':'Aktuell unbekannt'],['Positionsverwaltung',f.fresh?'Bereit':'Aktuell unbekannt'],['Ältere Revision',v[9]==='Auslaufend'?'Offene Verpflichtung bleibt erhalten':'In Originalhistorie enthalten']])}<button type="button" class="fc-link cursor-interaction" data-tab="journal">Positionen und Ausführung ansehen →</button></div>`;}
 function pools(f){if(f.id==='nova')return [['Pool DE40 / Opening Range',2000,0,'0 € belegt · frei für gültige Gelegenheiten'],['Pool US100 / Breakout',500,0,'0 € Stoprisiko nach Schutzanpassung · 1 Position'],['Pool DE40 / Late Breakout',1500,1500,'1.500 € UNKNOWN-Reservierung · keine neue Aufnahme']];return [[`Pool ${f.name} / Hauptlinie`,f.cap,f.risk,`${eur(f.risk)} gebundene Wirkung einschließlich Reservierungen`]];}
 function riskPanel(f){const ar=values(f),peak=ar.reduce((s,x)=>{s.peak=Math.max(s.peak,x);s.a.push(x-s.peak);return s},{peak:ar[0],a:[]}).a;return `<div class="fc-split"><section class="fc-panel"><h2>Ressourcen & Pools</h2><p class="fc-subtitle">Autorisierte Kernwerte im Beispiel · Stoprisiko in EUR</p>${pools(f).map(([name,c,u,desc])=>`<div class="fc-pool"><div class="fc-barlabel"><span>${name}</span><span>${eur(u)} / ${eur(c)}</span></div><div class="fc-meter"><span style="width:${u/c*100}%;${f.id==='nova'&&u>0?'background:var(--fc-amber)':''}"></span></div><p class="fc-meta" style="margin-top:7px">${desc}</p></div>`).join('')}${f.id==='nova'?'<div class="fc-notice" style="margin:12px 0 0">UNKNOWN seit 14:20 · Intent NV-042. Keine endgültige Brokerwirkung belegt. Reservierung bleibt bestehen; das Desk gibt keine Kapazität frei.</div>':''}</section><section class="fc-panel"><h2>Andere Risikodimensionen</h2><p class="fc-subtitle">Jede Komponente bleibt separat</p>${dataRows([['Native Kontomargin',eur(f.margin)],['Stressmargin','— · Modellprofil fehlt'],['Offene Positionen',f.positions+' / 8 Slots'],['Brokerorders','0 / 8 Slots'],['Outstanding-Intents',f.id==='nova'?'1 UNKNOWN':'0'],['Bruttoexposure','— · Bewertungsquelle fehlt']])}<p class="fc-meta" style="margin-top:12px">Unbekannte Werte werden nicht durch null ersetzt.</p></section></div><section class="fc-panel fc-section"><h2>Beobachteter Drawdown</h2><p class="fc-meta">Netto-PnL unter vorherigem Hoch · EUR · 5-Minuten-Sampling</p>${chart(peak,'Beobachteter Rückgang des Netto-PnL in EUR',{drawdown:true})}</section>`;}
 function journal(f=null){let rows=demoPositions.filter(r=>!f||r[0]===f.id);return `${f?'':header('Trading Journal','Positionen, Originale und die Kette zur Ausführung.')}<section class="fc-panel"><div class="fc-panelhead"><h2>Offene Positionen</h2><span class="fc-tag">Snapshot · 04.11.</span></div><p class="fc-subtitle">Letzter bekannter Stand je Quelle · Ergebnis einschließlich offener Bewertung</p><div class="fc-tablewrap"><table><thead><tr><th>Flotte / Strategie</th><th>Symbol</th><th>Richtung / Volumen</th><th>Seit · CET</th><th>Offen</th><th>Beleg</th></tr></thead><tbody>${rows.map(r=>{const idx=demoPositions.indexOf(r),ff=fleets.find(x=>x.id===r[0]);return `<tr><td>${ff.name}<small>${r[1]}</small></td><td>${r[2]}</td><td>${r[3]}<small>${r[6]} Lot</small></td><td>${r[5]}<small>${ff.fresh?'Stand 14:35':'Stand 14:05 · veraltet'}</small></td><td class="${tone(r[4])}">${signed(r[4])}</td><td><button class="fc-link cursor-interaction" type="button" data-position="${idx}">Details →</button></td></tr>`}).join('')}</tbody></table></div>${positionDetail()}</section><div class="fc-split fc-section"><section class="fc-panel"><h2>Tradezyklen / 30 Tage</h2>${dataRows([['Geschlossene Zyklen',f?f.trades:216],['Gruppierung','Position + Originalrevision'],['Teilabgänge','Bestandteil desselben Zyklus'],['Gebuchte Kosten','Einmal im Nettowert enthalten']])}<p class="fc-meta" style="margin-top:12px">Rohdeals sind keine Tradezahl. Jeder Zyklus behält seine ursprüngliche Revision.</p></section><section class="fc-panel"><h2>Gelegenheiten</h2>${dataRows([['Kein Signal','Eigener Zustand'],['Signal verworfen','Kapazität / Quote / Policy'],['Nicht gesendet','Mit Entscheidungsgrund'],['Broker abgelehnt','Endgültige Ablehnung'],['Wirkung unbekannt','Nova · NV-042']])}</section></div>`;}
 function positionDetail(){if(state.position===null||!demoPositions[state.position])return '';const p=demoPositions[state.position],ff=fleets.find(x=>x.id===p[0]);return `<div class="fc-detail"><div class="fc-panelhead"><h2>${p[2]} / ${p[3]} / Positionsdetail</h2><button type="button" class="fc-link cursor-interaction" data-close-position="1">Schließen</button></div><p class="fc-subtitle">${ff.name} · ${p[1]} · fiktive IDs zur Darstellung</p>${dataRows([['Stabile Position / aktuelles Ticket',`P-DEMO-${state.position+1} / T-DEMO-${state.position+1}`],['Ursprüngliches Anfangsrisiko','— · Risikobeleg nicht in der Designstudie'],['Ursprünglicher / aktueller SL','— · Schutzbeleg nicht in der Designstudie'],['Offene Bewertung',signed(p[4])],['MAE / MFE','— · Zwischenbewertungen nicht im Draft']])}<div class="fc-timeline"><div class="fc-event">${p[5]} · Gelegenheit & Intent<small>Originalvariante und Pool werden gebunden.</small></div><div class="fc-event">Request → Order → Fill<small>Ein Tradezyklus kann mehrere Deals enthalten.</small></div><div class="fc-event">${ff.age} · Position offen<small>Verwaltung: ${ff.fresh?'bereit':'aktuell unbekannt'} · Teilabgänge bleiben korreliert.</small></div></div></div>`;}
 function analysis(f){const arr=variantData[f.id];return `<div class="fc-split"><section class="fc-panel"><h2>Journal-Kalender</h2><p class="fc-subtitle">November 2026 · gebuchtes Tagesnetto · Beispieltage</p><div class="fc-calendar">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<span class="fc-weekday">${x}</span>`).join('')}${Array.from({length:6},()=>'<span></span>').join('')}<div class="fc-day">1<b>0 €</b></div><div class="fc-day gain">2<b>+420 €</b></div><div class="fc-day loss">3<b>−160 €</b></div><div class="fc-day ${f.fresh?'gain':'gap'}">4<b>${f.fresh?'+310 €':'Lücke'}</b></div></div><div class="fc-legend"><span>Demo-Kalendermuster</span><span>Keine Summe der Flotten-KPI</span></div><p class="fc-meta" style="margin-top:16px">Kalendertage verwenden Buchungszeitpunkte; Tradezyklen verwenden den vollständigen Lebenszyklus. Offene Bewertung wird separat geführt.</p></section><section class="fc-panel"><h2>Auswertungsumfang</h2>${dataRows([['Symbol / Timeframe',f.tf+' · '+f.count+' Varianten'],['Expectancy netto / Zyklus','— · Zyklen-Ledger im Draft nicht enthalten'],['Haltedauer / Verlustserie','— · Originalzyklen erforderlich'],['MAE / MFE','— · qualifizierter Pfad erforderlich'],['Korrelation','— · synchronisierte Reihen erforderlich']])}</section></div><section class="fc-panel fc-section"><h2>Strategiebeiträge / 30 Tage</h2>${contributions(f)}<details><summary>Kosten & Qualität</summary><p>Profit, Kommission, Swap, Fee und separate Buchungen werden genau einmal berücksichtigt. Spread und Slippage erhalten eine eigene Attribution und werden nicht erneut abgezogen. Für die Designstudie sind keine Kostenoriginale hinterlegt.</p></details></section>`;}

 function accounts(scope){return `<section class="fc-panel fc-section"><h2>Konten / Einsätze</h2><p class="fc-subtitle">Native Kontoperspektive · ein separates EUR-Demokonto je Flotte · Fremdanteile 0 € als Demoannahme</p><div class="fc-tablewrap"><table><thead><tr><th>Konto / Flotte</th><th>Balance / Equity</th><th>Credit</th><th>Margin / frei</th><th>Marginlevel</th></tr></thead><tbody>${scope.map(f=>`<tr><td>DEMO-${fleets.indexOf(f)+1}<small>${f.name} · Stand ${f.age}${f.fresh?'':' · veraltet'}</small></td><td>${eur(100000+f.booked)}<small>Equity ${eur(100000+f.pnl)}</small></td><td>0 €</td><td>${eur(f.margin)}<small>Frei ${eur(100000+f.pnl-f.margin)}</small></td><td>${fmt((100000+f.pnl)/f.margin*100)} %</td></tr>`).join('')}</tbody></table></div><p class="fc-meta" style="margin-top:12px">Cashflows und unzugeordnete Kosten: 0 € im Demozeitraum. Abgleichsrest: 0 € als Demoannahme; keine aktuelle Kontobestätigung.</p></section>`;}
 function ops(f=null){const scope=f?[f]:fleets;return `${f?'':header('Betrieb & Daten','Quellenfrische, tatsächlicher Fortschritt und bestätigte Zustände.')}<section class="fc-panel"><h2>Instanzen & Quellen</h2><p class="fc-subtitle">Demoaufnahme 14:35 CET · Frischegrenze im Beispiel: 10 Minuten</p><div class="fc-tablewrap"><table><thead><tr><th>Flotte / Einsatz</th><th>Quelle / Instanz</th><th>Beobachtet</th><th>Empfangen</th><th>Fortschritt / Daten</th></tr></thead><tbody>${scope.map((ff,i)=>`<tr><td>${ff.name}<small>Demo · ${ff.rev}</small></td><td>VPS-DEMO-${fleets.indexOf(ff)+1}<small>Terminal-${fleets.indexOf(ff)+1} / EUR</small></td><td>${ff.age}:00</td><td>${ff.fresh?'14:35:12':'14:05:12'}</td><td class="${ff.fresh?'fc-pos':'fc-warn'}">${ff.fresh?'Bestätigt':'Aktuell unbekannt'}<small>${ff.fresh?'Quelle aktuell':'30 Min. ohne Beobachtung'}</small></td></tr>`).join('')}</tbody></table></div></section>${accounts(scope)}<div class="fc-split fc-section"><section class="fc-panel"><h2>Manifest & Identität</h2>${dataRows([['Soll / bestätigt',f?f.rev+' / '+f.rev:'Je Einsatz getrennt'],['Kontobindung','Broker + Server + Konto + Währung'],['Build / Session','Fiktiver Stand der Designstudie'],['Altrevisionen','Historie und Verpflichtungen bleiben'],['Kritisches Ausführungsjournal','Eigener Betriebszustand']])}</section><section class="fc-panel"><h2>Datenfähigkeiten</h2>${dataRows([['Konto / Positionen','Im Beispiel dargestellt'],['Pool / Intentzustand','Im Beispiel dargestellt'],['Sampling','5 Minuten · Spitzen dazwischen unbekannt'],['MAE / MFE','Nicht verfügbar'],['Originalexport / API','Noch nicht angebunden']])}</section></div><section class="fc-panel fc-section"><h2>Ereignisse & Abgleich</h2><div class="fc-timeline">${!f||f.id==='nova'?'<div class="fc-event">14:20 · Nova / UNKNOWN<small>1.500 € mögliche Wirkung reserviert. Late-Breakout-Pool für Neueinstiege gesperrt; Verwaltung bereit.</small></div>':''}${!f||f.id==='vega'?'<div class="fc-event">14:05 · Vega / letzte Beobachtung<small>Keine spätere Quellenaufnahme. Broker-, Kern-, Entry- und Verwaltungszustand aktuell unbekannt.</small></div>':''}<div class="fc-event">Quellenqualität & Abgleich<small>Unzugeordnete Buchungen, Lücken und Residualbeträge werden separat ausgewiesen. Keine automatische Verteilung auf Varianten.</small></div></div></section>`;}
 function globalRisk(){return header('Risikoübersicht','Genehmigte Ressourcen, tatsächliche Belegung und gebundene Wirkung.')+`<div class="fc-stats">${metric('Stoprisiko gebunden',eur(8800),'3 aktuelle EUR-Flotten · Teilumfang')}${metric('Genehmigter Rahmen',eur(18000),'Kompatible Beispiel-Policies')}${metric('UNKNOWN gebunden',eur(1500),'Nova · 1 Intent','fc-warn')}${metric('Veraltete Quelle','Vega','900 € letzter Stand · ausgeschlossen','fc-warn')}</div><section class="fc-panel"><h2>Ressourcen je Flotte</h2>${fleets.map(f=>`<div class="fc-pool"><div class="fc-barlabel"><button type="button" class="fc-link cursor-interaction" data-fleet="${f.id}" data-tab="risk">${f.name} →</button><span>${eur(f.risk)} / ${eur(f.cap)}${f.fresh?'':' · veraltet'}</span></div><div class="fc-meter"><span style="width:${100*f.risk/f.cap}%"></span></div><p class="fc-meta" style="margin-top:6px">Entry: ${f.entry} · ${f.manage}</p></div>`).join('')}</section><p class="fc-subtitle" style="margin-top:14px">Keine Summe einzelner Maximal-DDs. Keine Gleichsetzung von Stoprisiko, nativer Margin, Stressmargin und Kapital.</p>`;}
 function drawCharts(){root.querySelectorAll('.fc-chart').forEach(svg=>{const a=svg.dataset.values.split(',').map(Number);const w=Math.max(svg.getBoundingClientRect().width,230),h=201,pad={l:54,r:15,t:12,b:37},lo=Math.min(0,...a),hi=Math.max(0,...a),span=hi-lo||1;const y=v=>pad.t+(hi-v)/span*(h-pad.t-pad.b),x=i=>pad.l+i/(a.length-1)*(w-pad.l-pad.r),path=a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');const gid='fc-grad-'+Math.random().toString(36).slice(2,9),color=svg.dataset.dd==='true'?'var(--fc-purple)':'var(--fc-cyan)';svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const ticks=[hi,(hi+lo)/2,lo].filter((v,i,ar)=>ar.indexOf(v)===i);svg.innerHTML=`<title>${svg.getAttribute('aria-label')}</title><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".23"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${ticks.map(v=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--fc-line)" stroke-width="1"/><text x="${pad.l-9}" y="${y(v)+4}" text-anchor="end">${Math.abs(v)>=1000?(v/1000).toFixed(1).replace('.',',')+'k':fmt(v)}</text>`).join('')}<path d="${path} L${x(a.length-1)},${h-pad.b} L${pad.l},${h-pad.b} Z" fill="url(#${gid})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(a.length-1)}" cy="${y(a[a.length-1])}" r="3" fill="${color}"/><text x="${pad.l}" y="${h-14}">${state.days===30?'05.10.':'28.10.'}</text><text x="${(pad.l+w-pad.r)/2}" y="${h-14}" text-anchor="middle">${state.days===30?'20.10.':'01.11.'}</text><text x="${w-pad.r}" y="${h-14}" text-anchor="end">04.11.</text><text x="8" y="${h-14}">EUR</text>`;});root.querySelectorAll('[data-spark]').forEach(svg=>{const f=fleets.find(f=>f.id===svg.dataset.spark),a=values(f),lo=Math.min(...a),hi=Math.max(...a),span=hi-lo||1;svg.setAttribute('viewBox','0 0 100 35');svg.innerHTML=`<path d="${a.map((v,i)=>(i?'L':'M')+(3+i/(a.length-1)*94).toFixed(1)+','+(31-(v-lo)/span*27).toFixed(1)).join(' ')}" fill="none" stroke="${delta(f)<0?'var(--fc-red)':'var(--fc-cyan)'}" stroke-width="1.5"/>`;});}
 function render(){if(state.variant!==null&&state.fleet&&state.tab!=='variants')state.variant=null;content.innerHTML=state.fleet?fleetPage():state.page==='fleets'?overview():state.page==='journal'?journal():state.page==='risk'?globalRisk():ops();root.querySelectorAll('[data-page]').forEach(b=>{if((state.fleet?'fleets':state.page)===b.dataset.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});drawCharts();if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;let announcement='Ansicht aktualisiert';if(b.dataset.page){state.page=b.dataset.page;state.fleet=null;state.variant=null;state.position=null;announcement=b.textContent.trim();}else if(b.dataset.fleet){state.fleet=b.dataset.fleet;state.tab=b.dataset.tab||'overview';state.variant=null;state.position=null;announcement=fleets.find(f=>f.id===state.fleet).name+' geöffnet';}else if(b.dataset.back){state.fleet=null;state.page='fleets';state.variant=null;state.position=null;}else if(b.dataset.days){state.days=Number(b.dataset.days);}else if(b.dataset.variant!==undefined){state.variant=Number(b.dataset.variant);state.tab='variants';}else if(b.dataset.closeVariant){state.variant=null;}else if(b.dataset.tab){state.tab=b.dataset.tab;state.position=null;}else if(b.dataset.position!==undefined){state.position=Number(b.dataset.position);}else if(b.dataset.closePosition){state.position=null;}else return;render();persist();root.querySelector('#fc-announcement').textContent=announcement;});
 window.addEventListener('openai:set_globals',e=>{const st=e.detail?.globals?.widgetState?.modelContent?.fleetDesk;if(st&&typeof st==='object'){if(['fleets','journal','risk','ops'].includes(st.page))state.page=st.page;if(st.fleet===null||fleets.some(f=>f.id===st.fleet))state.fleet=st.fleet;if(tabs.some(t=>t[0]===st.tab))state.tab=st.tab;if([7,30].includes(st.days))state.days=st.days;render();}});
 render();let lastWidth=0;new ResizeObserver(()=>{const w=root.getBoundingClientRect().width;if(Math.abs(w-lastWidth)>1){lastWidth=w;drawCharts();}}).observe(root);
 if(globalThis.Tweak){const design={radius:18,accent:'#75e6f4'};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--fc-radius',design.radius+'px');root.style.setProperty('--fc-cyan',design.accent);drawCharts();}});tweak.addSlider(design,'radius',{label:'Kartenrundung',min:4,max:24,unit:'px'});tweak.addColorPicker(design,'accent',{label:'Akzentfarbe',reference:'--fc-cyan'});}
})();
</script>
