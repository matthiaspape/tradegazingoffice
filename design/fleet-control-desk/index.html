 function cards(){return `&lt;div class=&quot;fc-fleetgrid&quot;&gt;${fleets.map(f=&gt;`&lt;article class=&quot;fc-fleet&quot;&gt;&lt;div class=&quot;fc-fleet-head&quot;&gt;&lt;div class=&quot;fc-fleet-name&quot;&gt;&lt;span class=&quot;fc-emblem&quot;&gt;&lt;i data-lucide=&quot;${f.icon}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;div&gt;&lt;h2&gt;${f.name}&lt;/h2&gt;&lt;p&gt;${f.role}&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;fc-badge&quot;&gt;Demo · ${f.rev}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fc-fleet-pnl&quot;&gt;&lt;div&gt;&lt;div class=&quot;fc-meta&quot;&gt;Trading-Nettoergebnis&lt;/div&gt;&lt;div class=&quot;fc-pnl ${tone(delta(f))}&quot;&gt;${signed(delta(f))}&lt;/div&gt;&lt;/div&gt;${spark(f)}&lt;/div&gt;&lt;div class=&quot;fc-three&quot;&gt;&lt;div&gt;&lt;small&gt;Profit Factor · 30 T&lt;/small&gt;${f.pf}&lt;/div&gt;&lt;div&gt;&lt;small&gt;Winrate · 30 T&lt;/small&gt;${(100*f.wins/f.trades).toFixed(1).replace(&#x27;.&#x27;,&#x27;,&#x27;)} %&lt;/div&gt;&lt;div&gt;&lt;small&gt;Max. beobachteter DD&lt;/small&gt;${eur(dd(values(f)))}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fc-meta&quot;&gt;${f.count} Varianten · ${f.tf} · ${f.trades} Zyklen / 30 T&lt;/div&gt;&lt;div class=&quot;fc-resource&quot;&gt;&lt;span&gt;Stoprisiko gebunden&lt;/span&gt;&lt;span&gt;${eur(f.risk)} / ${eur(f.cap)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fc-meter&quot;&gt;&lt;span style=&quot;width:${100*f.risk/f.cap}%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fc-state&quot;&gt;&lt;span class=&quot;${f.fresh?(f.id===&#x27;nova&#x27;?&#x27;fc-warn&#x27;:&#x27;fc-pos&#x27;):&#x27;fc-warn&#x27;}&quot;&gt;&lt;span class=&quot;fc-dot&quot;&gt;&lt;/span&gt;${f.status}&lt;/span&gt;&lt;span&gt;Entry: ${f.entry}&lt;/span&gt;&lt;span&gt;${f.manage}&lt;/span&gt;${f.id===&#x27;nova&#x27;?&#x27;&lt;span class=&quot;fc-warn&quot;&gt;1 Pool 100 % · UNKNOWN 1.500 €&lt;/span&gt;&#x27;:&#x27;&#x27;}${f.id===&#x27;atlas&#x27;?&#x27;&lt;span&gt;1 Altposition · Revision auslaufend&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;fc-cardbottom&quot;&gt;&lt;span class=&quot;fc-meta&quot;&gt;${f.positions} Position${f.positions&gt;1?&#x27;en&#x27;:&#x27;&#x27;} · Stand ${f.age}&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;fc-link cursor-interaction&quot; data-fleet=&quot;${f.id}&quot;&gt;Flotte öffnen &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
 function attention(){return `&lt;section class=&quot;fc-panel&quot;&gt;&lt;div class=&quot;fc-panelhead&quot;&gt;&lt;h2&gt;Aufmerksamkeit&lt;/h2&gt;&lt;span class=&quot;fc-tag&quot;&gt;2 Flotten&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fc-incident&quot;&gt;&lt;strong class=&quot;fc-warn&quot;&gt;Nova · Wirkung ungeklärt&lt;/strong&gt;&lt;p&gt;Ein Intent bindet 1.500 € Stoprisiko. Ein Pool nimmt keine neuen Einstiege an.&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;fc-link cursor-interaction&quot; data-fleet=&quot;nova&quot; data-tab=&quot;risk&quot;&gt;Pool ansehen →&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fc-incident&quot;&gt;&lt;strong class=&quot;fc-warn&quot;&gt;Vega · Quelle veraltet&lt;/strong&gt;&lt;p&gt;Letzte Beobachtung 14:05. Aktueller Handelszustand unbekannt; aus Gesamtsumme ausgeschlossen.&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;fc-link cursor-interaction&quot; data-fleet=&quot;vega&quot; data-tab=&quot;ops&quot;&gt;Datenstatus ansehen →&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;`;}
 function overview(){const current=observed(),sum=current.reduce((s,f)=&gt;s+delta(f),0),p=totalPath();return header(&#x27;Flottenübersicht&#x27;,&#x27;Performance, Risiko und Betrieb deiner Flotten-EAs.&#x27;)+`&lt;div class=&quot;fc-toolbar&quot;&gt;&lt;span class=&quot;fc-meta&quot;&gt;${range()} · EUR · Demo-Einsätze&lt;/span&gt;&lt;span class=&quot;fc-meta&quot;&gt;&lt;span class=&quot;fc-dot fc-pos&quot;&gt;&lt;/span&gt;3 von 4 Quellen aktuell · Teilumfang&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fc-stats&quot;&gt;${metric(&#x27;Trading-Nettoergebnis&#x27;,signed(sum),&#x27;3 von 4 Flotten · gleicher EUR-Scope&#x27;,tone(sum))}${metric(&#x27;Max. beobachteter DD&#x27;,eur(dd(p)),&#x27;PnL-Pfad · 5-Min.-Sampling&#x27;)}${metric(&#x27;Stoprisiko gebunden&#x27;,eur(8800),&#x27;von 18.000 € · 1 Pool 100 % / UNKNOWN&#x27;)}${metric(&#x27;Aufmerksamkeit&#x27;,&#x27;2 Flotten&#x27;,&#x27;1 Entryblockade · 1 veraltete Quelle&#x27;,&#x27;fc-warn&#x27;)}&lt;/div&gt;&lt;div class=&quot;fc-split&quot;&gt;&lt;section class=&quot;fc-panel&quot;&gt;&lt;div class=&quot;fc-panelhead&quot;&gt;&lt;h2&gt;Netto-PnL-Verlauf&lt;/h2&gt;&lt;span class=&quot;fc-tag&quot;&gt;3 aktuelle Flotten&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;fc-meta&quot;&gt;Gebucht + offene Bewertung · 0 € am Zeitraumstart&lt;/p&gt;${chart(p,&#x27;Zurechenbarer Netto-PnL der drei aktuellen Beispiel-Flotten in EUR&#x27;)}&lt;div class=&quot;fc-legend&quot;&gt;&lt;span&gt;&lt;span class=&quot;fc-linekey&quot;&gt;&lt;/span&gt;Netto-PnL · EUR&lt;/span&gt;&lt;span&gt;Vega ausgeschlossen · keine Konto-Equity&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;${attention()}&lt;/div&gt;&lt;div class=&quot;fc-toolbar&quot;&gt;&lt;h2&gt;Deine Flotten &lt;span class=&quot;fc-muted&quot;&gt;/ 04&lt;/span&gt;&lt;/h2&gt;&lt;span class=&quot;fc-meta&quot;&gt;Alle Stände sichtbar · Kennzahlen nach Scope&lt;/span&gt;&lt;/div&gt;${cards()}`;}
 function fleetStatus(f){const stale=!f.fresh;return `&lt;div class=&quot;fc-statusbar&quot;&gt;&lt;span class=&quot;${stale?&#x27;fc-warn&#x27;:&#x27;fc-pos&#x27;}&quot;&gt;Kern: ${stale?&#x27;unbekannt&#x27;:&#x27;Fortschritt bestätigt&#x27;}&lt;/span&gt;&lt;span&gt;Worker: ${stale?&#x27;unbekannt&#x27;:f.count+&#x27;/&#x27;+f.count+&#x27; bereit&#x27;}&lt;/span&gt;&lt;span&gt;Broker: ${stale?&#x27;unbekannt&#x27;:&#x27;verbunden&#x27;}&lt;/span&gt;&lt;span class=&quot;${stale?&#x27;fc-warn&#x27;:&#x27;fc-pos&#x27;}&quot;&gt;Daten: ${stale?&#x27;30 Min. alt&#x27;:&#x27;aktuell&#x27;}&lt;/span&gt;&lt;span&gt;Entry: ${f.entry}&lt;/span&gt;&lt;span&gt;${f.manage}&lt;/span&gt;&lt;span&gt;UNKNOWN: ${stale?&#x27;unbekannt&#x27;:f.id===&#x27;nova&#x27;?&#x27;1 / 1.500 €&#x27;:&#x27;0&#x27;}&lt;/span&gt;&lt;span&gt;Aufnahme: Demo bestätigt&lt;/span&gt;&lt;/div&gt;`;}
 function fleetStats(f){const n=delta(f);return `&lt;div class=&quot;fc-stats&quot;&gt;${metric(&#x27;Trading-Nettoergebnis&#x27;,signed(n),state.days===30?`Gebucht ${signed(f.booked)} · offen ${signed(f.float)}`:&#x27;Veränderung gebucht + offen · 7 Tage&#x27;,tone(n))}${metric(&#x27;Profit Factor · 30 Tage&#x27;,f.pf,`${f.trades} geschlossene Tradezyklen`)}${metric(&#x27;Winrate · 30 Tage&#x27;,(100*f.wins/f.trades).toFixed(1).replace(&#x27;.&#x27;,&#x27;,&#x27;)+&#x27; %&#x27;,`${f.wins} Gewinn · ${f.trades-f.wins} Verlust · 0 BE`)}${metric(&#x27;Max. beobachteter DD&#x27;,eur(dd(values(f))),&#x27;PnL-Pfad · EUR · gewählter Zeitraum&#x27;)}&lt;/div&gt;`;}
 const tabs=[[&#x27;overview&#x27;,&#x27;Überblick&#x27;],[&#x27;variants&#x27;,&#x27;Varianten&#x27;],[&#x27;risk&#x27;,&#x27;Risiko&#x27;],[&#x27;journal&#x27;,&#x27;Journal&#x27;],[&#x27;analysis&#x27;,&#x27;Analyse&#x27;],[&#x27;ops&#x27;,&#x27;Betrieb &amp; Daten&#x27;]];
 function fleetPage(){const f=fleets.find(x=&gt;x.id===state.fleet);return header(f.name+&#x27; / Fleet&#x27;,`${f.role} · Demo-Einsatz · Manifest ${f.rev} · ${range()}`,true)+(!f.fresh?&#x27;&lt;div class=&quot;fc-notice&quot;&gt;Veralteter Stand von 14:05 · 30 Minuten ohne neue Beobachtung. Entry und Verwaltung sind aktuell unbekannt. Alle Werte unten sind der letzte bekannte Stand.&lt;/div&gt;&#x27;:&#x27;&#x27;)+fleetStatus(f)+`&lt;div class=&quot;fc-tabs&quot; aria-label=&quot;Flottendetails&quot;&gt;${tabs.map(([id,label])=&gt;`&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-tab=&quot;${id}&quot; aria-pressed=&quot;${state.tab===id}&quot;&gt;${label}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`+(state.tab===&#x27;overview&#x27;?fleetOverview(f):state.tab===&#x27;variants&#x27;?variants(f):state.tab===&#x27;risk&#x27;?riskPanel(f):state.tab===&#x27;journal&#x27;?journal(f):state.tab===&#x27;analysis&#x27;?analysis(f):ops(f));}
 function fleetOverview(f){return fleetStats(f)+`&lt;section class=&quot;fc-panel&quot;&gt;&lt;div class=&quot;fc-panelhead&quot;&gt;&lt;h2&gt;Zurechenbares Flottenergebnis&lt;/h2&gt;&lt;span class=&quot;fc-tag&quot;&gt;${f.rev} · EUR&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;fc-meta&quot;&gt;${range()} · Messintervall 5 Min. · Kurve für den Draft verdichtet&lt;/p&gt;${chart(values(f).map(v=&gt;v-values(f)[0]),f.name+&#x27; Netto-PnL in EUR&#x27;)}&lt;div class=&quot;fc-legend&quot;&gt;&lt;span&gt;&lt;span class=&quot;fc-linekey&quot;&gt;&lt;/span&gt;Trading-Nettoergebnis&lt;/span&gt;&lt;span&gt;Cashflows separat · kein Prozentwert ohne Kapitalbasis&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;fc-split fc-section&quot;&gt;&lt;section class=&quot;fc-panel&quot;&gt;&lt;h2&gt;Strategiebeiträge&lt;/h2&gt;&lt;p class=&quot;fc-subtitle&quot;&gt;30 Tage · einschließlich offener Bewertung&lt;/p&gt;${contributions(f)}&lt;button type=&quot;button&quot; class=&quot;fc-link cursor-interaction&quot; data-tab=&quot;variants&quot;&gt;Alle Varianten im Detail →&lt;/button&gt;&lt;/section&gt;&lt;section class=&quot;fc-panel&quot;&gt;&lt;h2&gt;Kontoperspektive&lt;/h2&gt;&lt;p class=&quot;fc-subtitle&quot;&gt;Ein eigenes EUR-Demokonto je Flotte&lt;/p&gt;${dataRows([[&#x27;Native Equity&#x27;,eur(100000+f.pnl)],[&#x27;Native Balance&#x27;,eur(100000+f.booked)],[&#x27;Native Margin&#x27;,eur(f.margin)],[&#x27;Offene Bewertung&#x27;,signed(f.float)],[&#x27;Cashflows im Zeitraum&#x27;,&#x27;0 €&#x27;],[&#x27;Abgleichsrest&#x27;,&#x27;0 € · Demoannahme&#x27;]])}&lt;p class=&quot;fc-meta&quot;&gt;Basisaufnahme 05.10.: 100.000 € · Konto- und Flottenscope im Beispiel identisch.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;`;}
 function contributions(f){const max=Math.max(...variantData[f.id].map(v=&gt;Math.abs(v[5])));return `&lt;div class=&quot;fc-barlist&quot;&gt;${variantData[f.id].map((v,i)=&gt;`&lt;div&gt;&lt;div class=&quot;fc-barlabel&quot;&gt;&lt;button class=&quot;fc-link cursor-interaction&quot; type=&quot;button&quot; data-variant=&quot;${i}&quot;&gt;${v[0]}&lt;/button&gt;&lt;span class=&quot;${tone(v[5])}&quot;&gt;${signed(v[5])}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fc-meter&quot;&gt;&lt;span style=&quot;width:${Math.abs(v[5])/max*100}%;background:${v[5]&lt;0?&#x27;var(--fc-red)&#x27;:&#x27;var(--fc-cyan)&#x27;}&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
 function dataRows(rows){return `&lt;div class=&quot;fc-rows&quot;&gt;${rows.map(([a,b])=&gt;`&lt;div class=&quot;fc-datarow&quot;&gt;&lt;span&gt;${a}&lt;/span&gt;&lt;span&gt;${b}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
 function variants(f){const list=variantData[f.id];return `&lt;section class=&quot;fc-panel&quot;&gt;&lt;div class=&quot;fc-panelhead&quot;&gt;&lt;h2&gt;Varianten &amp; Strategien&lt;/h2&gt;&lt;span class=&quot;fc-tag&quot;&gt;${list.length} Varianten&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;fc-subtitle&quot;&gt;30-Tage-Kennzahlen · Originalrevisionen bleiben erhalten · x = nominales Entryrisiko&lt;/p&gt;&lt;div class=&quot;fc-tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Strategie&lt;/th&gt;&lt;th&gt;Symbol / TF&lt;/th&gt;&lt;th&gt;Entryrisiko x&lt;/th&gt;&lt;th&gt;Netto-PnL&lt;/th&gt;&lt;th&gt;PF / Zyklen&lt;/th&gt;&lt;th&gt;Zustand&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${list.map((v,i)=&gt;`&lt;tr&gt;&lt;td&gt;&lt;button class=&quot;fc-link cursor-interaction&quot; type=&quot;button&quot; data-variant=&quot;${i}&quot;&gt;${v[0]}&lt;/button&gt;&lt;small&gt;${v[3]} · Originalrevision&lt;/small&gt;&lt;/td&gt;&lt;td&gt;${v[1]}&lt;small&gt;${v[2]}&lt;/small&gt;&lt;/td&gt;&lt;td&gt;${eur(v[4])}&lt;small&gt;${(100*v[4]/list.reduce((s,v)=&gt;s+v[4],0)).toFixed(1).replace(&#x27;.&#x27;,&#x27;,&#x27;)} % von R&lt;/small&gt;&lt;/td&gt;&lt;td class=&quot;${tone(v[5])}&quot;&gt;${signed(v[5])}&lt;/td&gt;&lt;td&gt;${v[8]}&lt;small&gt;n = ${v[6]}&lt;/small&gt;&lt;/td&gt;&lt;td class=&quot;${v[9]===&#x27;UNKNOWN&#x27;?&#x27;fc-warn&#x27;:&#x27;&#x27;}&quot;&gt;${v[9]}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;fc-meta&quot; style=&quot;margin-top:14px&quot;&gt;Nominalrisikoanteile sind keine Kapitalanteile. Die tatsächliche Poolbelegung steht unter Risiko.&lt;/p&gt;${variantDetail(f)}&lt;/section&gt;`;}
 function variantDetail(f){if(state.variant===null||!variantData[f.id][state.variant])return &#x27;&#x27;;const v=variantData[f.id][state.variant];return `&lt;div class=&quot;fc-detail&quot;&gt;&lt;div class=&quot;fc-panelhead&quot;&gt;&lt;h2&gt;${v[0]} / ${v[3]}&lt;/h2&gt;&lt;button type=&quot;button&quot; class=&quot;fc-link cursor-interaction&quot; data-close-variant=&quot;1&quot;&gt;Schließen&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fc-subtitle&quot;&gt;${v[1]} · ${v[2]} · Strategiepaket / ${f.id}-${v[3]} · 30 Tage&lt;/p&gt;&lt;div class=&quot;fc-valuegroup&quot;&gt;&lt;div class=&quot;fc-plainstat&quot;&gt;&lt;small&gt;Netto-PnL · gebucht + offen&lt;/small&gt;${signed(v[5])}&lt;/div&gt;&lt;div class=&quot;fc-plainstat&quot;&gt;&lt;small&gt;Winrate · n = ${v[6]}&lt;/small&gt;${(100*v[7]/v[6]).toFixed(1).replace(&#x27;.&#x27;,&#x27;,&#x27;)} %&lt;/div&gt;&lt;div class=&quot;fc-plainstat&quot;&gt;&lt;small&gt;Ursprüngliches Entryrisiko x&lt;/small&gt;${eur(v[4])}&lt;/div&gt;&lt;div class=&quot;fc-plainstat&quot;&gt;&lt;small&gt;MAE / MFE&lt;/small&gt;— &lt;small&gt;Kein qualifizierter Positionspfad im Draft&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;${dataRows([[&#x27;Neueinstiege&#x27;,v[9]===&#x27;UNKNOWN&#x27;?&#x27;Gesperrt · Wirkung ungeklärt&#x27;:v[9]===&#x27;Auslaufend&#x27;?&#x27;Keine neuen Einstiege&#x27;:f.fresh?&#x27;Erlaubt&#x27;:&#x27;Aktuell unbekannt&#x27;],[&#x27;Positionsverwaltung&#x27;,f.fresh?&#x27;Bereit&#x27;:&#x27;Aktuell unbekannt&#x27;],[&#x27;Ältere Revision&#x27;,v[9]===&#x27;Auslaufend&#x27;?&#x27;Offene Verpflichtung bleibt erhalten&#x27;:&#x27;In Originalhistorie enthalten&#x27;]])}&lt;button type=&quot;button&quot; class=&quot;fc-link cursor-interaction&quot; data-tab=&quot;journal&quot;&gt;Positionen und Ausführung ansehen →&lt;/button&gt;&lt;/div&gt;`;}
 function pools(f){if(f.id===&#x27;nova&#x27;)return [[&#x27;Pool DE40 / Opening Range&#x27;,2000,0,&#x27;0 € belegt · frei für gültige Gelegenheiten&#x27;],[&#x27;Pool US100 / Breakout&#x27;,500,0,&#x27;0 € Stoprisiko nach Schutzanpassung · 1 Position&#x27;],[&#x27;Pool DE40 / Late Breakout&#x27;,1500,1500,&#x27;1.500 € UNKNOWN-Reservierung · keine neue Aufnahme&#x27;]];return [[`Pool ${f.name} / Hauptlinie`,f.cap,f.risk,`${eur(f.risk)} gebundene Wirkung einschließlich Reservierungen`]];}
